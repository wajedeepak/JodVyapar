<app-auth-layout>
  <app-page-header
    title="Forgot your password?"
    subtitle="Enter the email you registered with and we'll send you a 6-digit code to reset it."
  />

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="jv-stack">
    @if (formError(); as message) {
      <app-alert-banner type="error" [dismissible]="true" (dismissed)="formError.set(null)">
        {{ message }}
      </app-alert-banner>
    }

    <app-text-field
      [control]="form.controls.email"
      label="Email"
      type="email"
      autocomplete="email"
      inputmode="email"
      [errorMessages]="{ required: 'Please enter your email address.' }"
      [autofocus]="true"
    />

    <app-primary-button
      type="submit"
      label="Send reset code"
      loadingLabel="Sending code…"
      [loading]="submitting()"
      [fullWidth]="true"
    />
  </form>

  <p class="jv-form-footer">Remembered it? <a routerLink="/auth/login">Back to sign in</a></p>
</app-auth-layout>
