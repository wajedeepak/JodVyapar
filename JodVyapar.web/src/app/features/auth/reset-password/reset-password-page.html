<app-auth-layout>
  @if (targetEmail()) {
    <app-page-header title="Reset your password" [subtitle]="subtitle()" />

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="jv-stack">
      @if (formError(); as message) {
        <app-alert-banner type="error" [dismissible]="true" (dismissed)="formError.set(null)">
          {{ message }}
        </app-alert-banner>
      }
      @if (notice(); as message) {
        <app-alert-banner type="info" [dismissible]="true" (dismissed)="notice.set(null)">
          {{ message }}
        </app-alert-banner>
      }

      <app-code-input
        [control]="form.controls.code"
        hint="The code expires 10 minutes after we send it."
        [autofocus]="true"
      />

      <app-resend-code [secondsLeft]="cooldown.secondsLeft()" [sending]="resending()" (resend)="resend()" />

      <app-password-input
        [control]="form.controls.newPassword"
        label="New password"
        autocomplete="new-password"
        [showRequirements]="true"
        [errorMessages]="{ required: 'Please enter a new password.' }"
      />

      <app-primary-button
        type="submit"
        label="Reset password"
        loadingLabel="Resetting…"
        [loading]="submitting()"
        [fullWidth]="true"
      />
    </form>
  } @else {
    <app-page-header title="Reset your password" />
    <div class="jv-stack">
      <app-alert-banner type="warning">
        This link is missing your email address. Please start again and we'll send you a new code.
      </app-alert-banner>
      <a mat-button routerLink="/auth/forgot-password">Start again</a>
    </div>
  }

  <p class="jv-form-footer"><a routerLink="/auth/login">Back to sign in</a></p>
</app-auth-layout>
